<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Smart Glass Calendar - Perfect Version</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css');
        
        :root {
            --bg-color: #f1f5f9;
            --container-bg: rgba(255, 255, 255, 0.6); 
            --text-main: #1e293b;
            --border-color: rgba(0, 0, 0, 0.1);
            --header-bg: rgba(255, 255, 255, 0.4);
            --weekday-bg: rgba(249, 250, 251, 0.2);
        }

        .dark-mode {
            --bg-color: #1e293b; 
            --container-bg: rgba(30, 41, 59, 0.7);
            --text-main: #f8fafc;
            --border-color: rgba(255, 255, 255, 0.1);
            --header-bg: rgba(15, 23, 42, 0.4);
            --weekday-bg: rgba(30, 41, 59, 0.2);
        }

        * { 
            box-sizing: border-box; 
            margin: 0; 
            padding: 0; 
        }

        body { 
            transition: background-color 0.4s ease;
            font-family: 'Pretendard', sans-serif;
            background-color: var(--bg-color); 
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px;
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
            background-repeat: no-repeat;
        }

        .calendar-wrapper {
            max-width: 1200px;
            width: 100%;
            background-color: var(--container-bg);
            backdrop-filter: blur(25px);
            -webkit-backdrop-filter: blur(25px);
            border: 1px solid var(--border-color);
            border-radius: 24px;
            overflow: hidden;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.4);
        }

        .calendar-header {
            height: 90px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 32px;
            border-bottom: 1px solid var(--border-color);
            background-color: var(--header-bg);
        }

        .grid-container { 
            display: grid; 
            grid-template-columns: repeat(7, 1fr); 
            width: 100%;
            background-color: var(--border-color);
            gap: 1px; 
        }

        .weekday-cell {
            background-color: var(--weekday-bg);
            padding: 15px 0;
            text-align: center;
            font-weight: 800;
            font-size: 11px;
            letter-spacing: 1px;
        }

        .day-cell {
            background-color: transparent; 
            min-height: 140px;
            height: 16vh;
            padding: 12px;
            display: flex;
            flex-direction: column;
            justify-content: flex-start; 
            gap: 6px;
            cursor: pointer;
            transition: background-color 0.2s;
        }

        .day-cell:hover:not(.other-month) { 
            background-color: rgba(255, 255, 255, 0.1); 
        }
        
        .today { 
            box-shadow: inset 0 0 0 2px #3b82f6 !important;
            background-color: rgba(59, 130, 246, 0.05) !important;
        }

        .num-red { color: #ff6b6b; }
        .num-blue { color: #4dabf7; }
        .other-month { opacity: 0.1; pointer-events: none; }

        .schedule-list {
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .schedule-item {
            font-size: 11px;
            background-color: #3b82f6;
            color: white;
            padding: 4px 8px;
            border-radius: 4px;
            line-height: 1.2;
            word-break: break-all;
        }

        .ctrl-btn {
            width: 160px;
            height: 38px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            border-radius: 10px;
            border: 1px solid var(--border-color);
            background: var(--header-bg);
            font-size: 12px;
            font-weight: 700;
            transition: all 0.2s;
        }

        .ctrl-btn:hover { 
            background: #3b82f6; 
            color: white; 
            border-color: #3b82f6; 
        }

        .reset-btn {
            width: 80px;
            color: #ef4444;
        }
    </style>
</head>
<body>

    <div class="calendar-wrapper">   
        <div class="calendar-header">
            <div class="flex items-center gap-6">
                <button onclick="changeMonth(-1)" class="w-10 h-10 border rounded-xl hover:bg-blue-500 hover:text-white transition">◀</button>
                <h2 id="monthDisplay" class="text-2xl font-black min-w-[200px] text-center tracking-tight cursor-pointer"></h2>
                <button onclick="changeMonth(1)" class="w-10 h-10 border rounded-xl hover:bg-blue-500 hover:text-white transition">▶</button>
            </div>

            <div class="flex items-center gap-2">
                <button onclick="toggleDarkMode()" class="ctrl-btn">
                    <span id="darkIcon">🌙</span> 
                    <span id="darkText">다크모드 ON</span>
                </button>
                <button onclick="document.getElementById('themeUpload').click()" class="ctrl-btn"> 배경 업로드</button>
                <button onclick="resetTheme()" class="ctrl-btn reset-btn">초기화</button>
                <input type="file" id="themeUpload" accept="image/*" class="hidden" onchange="handleImageUpload(this)">
            </div>
        </div>

        <div class="grid-container">
            <div class="weekday-cell num-red">SUN</div>
            <div class="weekday-cell">MON</div>
            <div class="weekday-cell">TUE</div>
            <div class="weekday-cell">WED</div>
            <div class="weekday-cell">THU</div>
            <div class="weekday-cell">FRI</div>
            <div class="weekday-cell num-blue">SAT</div>
        </div>
        <div id="calendarGrid" class="grid-container"></div>
    </div>

    <script>
        const HOLIDAY_API_KEY = '61f7d829f860ed4f53b7f27f6c1d929973fc1c700ad9e6bdd7b64875c8cae82b'; 
        
        // 기본 배경화면 url
        const DEFAULT_IMAGE_URL = 'http://i.ibb.co/wFfscGj8/nikolai-artamonov-zk-QLx-Tin-Xk-unsplash.jpg';

        let currYear = new Date().getFullYear();
        let currMonth = new Date().getMonth();
        const holidayCache = {};

        async function init() {
            if (localStorage.getItem('dark-mode') === 'enabled') {
                document.body.classList.add('dark-mode');
                updateDarkUI(true);
            }
            loadTheme(); // 저장된 사진 또는 기본 사진 불러오기
            renderCalendar(); 
            await updateHolidays(); 
        }

        function handleImageUpload(input) {
            const file = input.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = (e) => {
                    const base64Image = e.target.result;
                    localStorage.setItem('user-bg-v6', base64Image);
                    applyTheme(base64Image);
                };
                reader.readAsDataURL(file);
            }
        }

        function applyTheme(imgUrl) { 
            document.body.style.backgroundImage = `url('${imgUrl}')`; 
        }

        function loadTheme() { 
            const saved = localStorage.getItem('user-bg-v6'); 
            // 저장된 게 있으면 쓰고, 없으면 기본 사진 사용
            if (saved) {
                applyTheme(saved);
            } else {
                applyTheme(DEFAULT_IMAGE_URL);
            }
        }

        function resetTheme() { 
            localStorage.removeItem('user-bg-v6'); 
            applyTheme(DEFAULT_IMAGE_URL); // 초기화 시 다시 기본 사진으로
        }

        function toggleDarkMode() {
            const isDark = document.body.classList.toggle('dark-mode');
            localStorage.setItem('dark-mode', isDark ? 'enabled' : 'disabled');
            updateDarkUI(isDark);
            renderCalendar();
        }

        function updateDarkUI(isDark) {
            document.getElementById('darkIcon').innerText = isDark ? '☀️' : '🌙';
            document.getElementById('darkText').innerText = isDark ? '라이트모드 ON' : '다크모드 ON';
        }

        function changeYearPrompt() {
            const newYear = prompt("이동할 년도를 입력하세요:", currYear);
            if (newYear && !isNaN(newYear)) {
                currYear = parseInt(newYear);
                renderCalendar();
                updateHolidays();
            }
        }

        async function updateHolidays() {
            const cacheKey = `${currYear}-${currMonth}`;
            if (holidayCache[cacheKey]) { 
                renderCalendar(); 
                return; 
            }
            const url = `https://apis.data.go.kr/B090041/openapi/service/SpcdeInfoService/getHoliDeInfo?solYear=${currYear}&solMonth=${String(currMonth + 1).padStart(2, '0')}&ServiceKey=${HOLIDAY_API_KEY}&_type=json`;
            try {
                const res = await fetch(url);
                const data = await res.json();
                const holidays = {};
                if (data.response?.body?.items?.item) {
                    const items = data.response.body.items.item;
                    (Array.isArray(items) ? items : [items]).forEach(i => {
                        const d = String(i.locdate);
                        holidays[`${d.substring(0,4)}-${Number(d.substring(4,6))}-${Number(d.substring(6,8))}`] = i.dateName;
                    });
                }
                holidayCache[cacheKey] = holidays;
                renderCalendar();
            } catch (e) { 
                console.warn("공휴일 데이터를 불러오지 못했습니다."); 
            }
        }

        function renderCalendar() {
            const display = document.getElementById('monthDisplay');
            display.innerHTML = `<span onclick="changeYearPrompt()" class="hover:underline hover:text-blue-500 transition-all">${currYear}년</span> ${currMonth + 1}월`;
            
            const firstDay = new Date(currYear, currMonth, 1).getDay();
            const lastDate = new Date(currYear, currMonth + 1, 0).getDate();
            const prevLastDate = new Date(currYear, currMonth, 0).getDate();
            const holidays = holidayCache[`${currYear}-${currMonth}`] || {};
            const today = new Date();

            let html = "";
            for (let i = firstDay; i > 0; i--) {
                html += `<div class="day-cell other-month">${prevLastDate - i + 1}</div>`;
            }
            for (let i = 1; i <= lastDate; i++) {
                const dateKey = `${currYear}-${currMonth + 1}-${i}`;
                const isToday = (currYear === today.getFullYear() && currMonth === today.getMonth() && i === today.getDate()) ? 'today' : '';
                const dayOfWeek = new Date(currYear, currMonth, i).getDay();
                
                let colorClass = "";
                if (holidays[dateKey] || dayOfWeek === 0) colorClass = "num-red";
                else if (dayOfWeek === 6) colorClass = "num-blue";

                const savedSchedule = localStorage.getItem(`sched-${dateKey}`);

                html += `
                    <div onclick="addSchedule('${dateKey}')" class="day-cell ${isToday}">
                        <div class="flex justify-between items-start">
                            <span class="text-xl font-black ${colorClass}">${i}</span>
                            <div class="flex flex-col items-end gap-1">
                                ${holidays[dateKey] ? `<span class="text-[10px] font-bold text-red-500">${holidays[dateKey]}</span>` : ''}
                            </div>
                        </div>
                        <div class="schedule-list">
                            ${savedSchedule ? `<div class="schedule-item truncate">${savedSchedule}</div>` : ''}
                        </div>
                    </div>
                `;
            }
            document.getElementById('calendarGrid').innerHTML = html;
        }

        function changeMonth(diff) {
            currMonth += diff;
            if (currMonth < 0) { 
                currYear--; 
                currMonth = 11; 
            } else if (currMonth > 11) { 
                currYear++; 
                currMonth = 0; 
            }
            renderCalendar(); 
            updateHolidays();
        }

        function addSchedule(key) {
            const oldVal = localStorage.getItem(`sched-${key}`) || "";
            const val = prompt("일정을 입력하세요 (공백만 입력 시 삭제):", oldVal);
            
            if (val !== null) {
                if (val.trim() === "") {
                    localStorage.removeItem(`sched-${key}`);
                } else {
                    localStorage.setItem(`sched-${key}`, val.trim());
                }
                renderCalendar();
            }
        }

        init();
    </script>
</body>
</html>
